<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Log</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <h1>TS Game Log</h1>


  <main>
  <!-- <div id="banner" class="banner" role="alert" hidden></div> -->

    <section id="stats" class="stats" aria-label="Summary" hidden></section>

    <form id="add-form" class="add-form">
      <h2>Add a game</h2>
      <label class="field wide">Title
        <input name="title" type="text" placeholder="Hades" autocomplete="off">
      </label>
      <label class="field">Platform
        <input name="platform" type="text" placeholder="PC">
      </label>
      <label class="field">Status
        <select name="status">
          <option value="backlog">Backlog</option>
          <option value="playing">Playing</option>
          <option value="completed">Completed</option>
          <option value="dropped">Dropped</option>
        </select>
      </label>
      <label class="field">Rating
        <select name="rating">
          <option value="">Unrated</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </label>
      <label class="field">Hours played
        <input name="hoursPlayed" type="number" min="0" step="0.5" placeholder="0">
      </label>
      <label class="field wide">Notes
        <input name="notes" type="text" placeholder="Anything worth remembering">
      </label>
      <button type="submit" class="primary">Add game</button>
    </form>

    <section id="game-list" class="game-list" aria-label="Your games"></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
